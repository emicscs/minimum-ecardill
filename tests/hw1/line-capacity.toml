image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 1000000

[[inputs]]
at_tick = 300000
uart = 0
data = "xxxxxxxxxxxxxxxxxxxx\n"

[assert]
uart0_contains = "command not found: xxxxxxxxxxxxxxxxxxxx"
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
