image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 1000000

[[inputs]]
at_tick = 300000
uart = 0
data = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\u007F\b\n"

[assert]
uart0_contains = "msh> command not found: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\nmsh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
