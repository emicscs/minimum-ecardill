image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 1000000

[[inputs]]
at_tick = 300000
uart = 0
data = "echo ab\u007F\u007Fgoodbye world\n"

[assert]
uart0_contains = "msh> goodbye world\nmsh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
